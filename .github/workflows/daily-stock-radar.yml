name: Daily Stock Radar

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  stock-radar:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TICKER: NVDA
      COMPANY_NAME: NVIDIA
      MAX_LINKS: "5"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run stock radar agent
        run: npm run daily > stock-radar.md

      - name: Create or update daily issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_NUMBER=$(gh issue list --state open --search "Daily Stock Radar in:title" --json number --jq '.[0].number')

          if [ -z "$ISSUE_NUMBER" ]; then
            gh issue create \
              --title "Daily Stock Radar" \
              --body-file stock-radar.md
          else
            gh issue comment "$ISSUE_NUMBER" \
              --body-file stock-radar.md
          fi
