name: Daily Stock Radar

on:
  push:
    branches:
      - main
  schedule:
    - cron: '5 9 * * *'
  workflow_dispatch:
    inputs:
      ticker:
        description: Stock ticker to research
        required: false
        default: NVDA
      company_name:
        description: Company name to research
        required: false
        default: NVIDIA
      max_links:
        description: Maximum number of links to review
        required: false
        default: "5"

permissions:
  contents: read
  issues: write

jobs:
  stock-radar:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TICKER: ${{ inputs.ticker || 'NVDA' }}
      COMPANY_NAME: ${{ inputs.company_name || 'NVIDIA' }}
      MAX_LINKS: ${{ inputs.max_links || '5' }}

    steps:
      - name: Checkout repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -b main "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git checkout --detach FETCH_HEAD

      - name: Set up Node
        run: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm install 22
          nvm use 22
          node --version
          npm --version

      - name: Install dependencies
        run: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm use 22
          npm ci

      - name: Typecheck
        run: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm use 22
          npm run typecheck

      - name: Run stock radar agent
        run: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm use 22
          npm run daily > stock-radar.md

      - name: Create or update daily issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_TITLE="Daily Stock Radar: ${TICKER}"
          ISSUE_NUMBER=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number')

          if [ -z "$ISSUE_NUMBER" ]; then
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body-file stock-radar.md
          else
            gh issue comment "$ISSUE_NUMBER" \
              --body-file stock-radar.md
          fi
