name: Daily Stock Radar

on:
  push:
    branches:
      - main
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      ticker:
        description: Stock ticker to research
        required: false
        default: NVDA
      company_name:
        description: Company name to research
        required: false
        default: NVIDIA
      max_links:
        description: Maximum number of links to review
        required: false
        default: "5"

permissions:
  contents: read
  issues: write

jobs:
  stock-radar:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TICKER: ${{ inputs.ticker || 'NVDA' }}
      COMPANY_NAME: ${{ inputs.company_name || 'NVIDIA' }}
      MAX_LINKS: ${{ inputs.max_links || '5' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run stock radar agent
        run: npm run daily > stock-radar.md

      - name: Create or update daily issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_TITLE="Daily Stock Radar: ${TICKER}"
          ISSUE_NUMBER=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number')

          if [ -z "$ISSUE_NUMBER" ]; then
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body-file stock-radar.md
          else
            gh issue comment "$ISSUE_NUMBER" \
              --body-file stock-radar.md
          fi
